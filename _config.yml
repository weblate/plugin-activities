remote_theme: galette/theme-ghpages

title: Galette Activities
description: Activities management
author: Johan Cwiklinski

# Not kept as an official plugin, so the header shows the community pill rather
# than the core one.
maintainer: community

# Releases are built and published by GitHub Actions, so no version is declared
# here: the theme reads the latest release and derives both download URLs from
# `archive`. Nothing to bump at release time.
plugin:
  name: Activities
  archive: galette-plugin-activities
  min_galette: "1.3.0"

# The one repository of the family with GitHub issues enabled, so that is the
# tracker — it has no Redmine project.
tracker_url: https://github.com/galette-plugins/plugin-activities/issues

# The theme takes the language from the first path segment and the page identity
# from the file name, so a translation Weblate adds needs nothing here.
defaults:
  - scope: {path: ""}
    values: {layout: default}

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
